<style>

button b{display:block;color:var(--spark);margin-bottom:.6em}
html,body{overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

#ib button:hover,#ib button:focus-visible,#ib button:active{color:var(--spark);border-color:var(--spark);opacity:1;outline:none}
#ib button svg{display:block;width:clamp(18px,3.4vw,28px);height:clamp(18px,3.4vw,28px);margin:0 auto;fill:currentColor;shape-rendering:crispEdges;filter:drop-shadow(1px 1px 0 #000);pointer-events:none}

#tz{display:none;position:fixed;left:0;top:0;width:55%;height:100%;z-index:1;touch-action:none}
.touch #tz{display:block}
#js{display:none;position:absolute;z-index:1;width:calc(var(--b)*1.5);height:calc(var(--b)*1.5);transform:translate(-50%,-50%);border-radius:50%;background:rgba(216,207,192,.1);border:3px solid rgba(216,207,192,.35);pointer-events:none}

......#.', '............', '............'], 'check': ['............', '..........##', '.........###', '........###.', '#......###..', '##....###...', '.##..###....', '..######....', '...####.....', '....##......', '............', '............'], 'lock': ['...######...', '..##....##..', '..#......#..', '..#......#..', '############', '############', '#####..#####', '#####..#####', '######.#####', '############', '############', '............'], 'gift': ['...##..##...', '..#..##..#..', '...##..##...', '############', '############', '#....##....#', '#....##....#', '#....##....#', '#....##....#', '#....##....#', '#....##....#', '############'], 'sun': ['.....##.....', '.#...##...#.', '..#......#..', '...######...', '##.######.##', '##.######.##', '...######...', '..#......#..', '.#...##...#.', '.....##.....', '............', '............'], 'chat': ['.##########.', '#..........#', '#..#..#..#.#', '#..........#', '#..........#', '.####..#####', '....#..#....', '....##......', '...#........', '............', '............', '............'], 'down': ['............', '............', '############', '.##########.', '..########..', '...######...', '....####....', '.....##.....', '............', '............', '............', '............'], 'dot': ['............', '....####....', '..########..', '.##########.', '.##########.', '.##########.', '.##########.', '.##########.', '.##########.', '..########..', '....####....', '............'], 'dotg': ['............', '....####....', '..########..', '.##########.', '.##########.', '.##########.', '.##########.', '.##########.', '.##########.', '..########..', '....####....', '............'], 'dotv': ['............', '....####....', '..########..', '.##########.', '.##########.', '.##########.', '.##########.', '.##########.', '.##########.', '..########..', '....####....', '............'], 'dotb': ['............', '....####....', '..########..', '.##########.', '.##########.', '.##########.', '.##########.', '.##########.', '. (function(){let c='.px{display:inline-block;width:1em;height:1em;margin-right:.3em;vertical-align:-.14em;background:currentColor;image-rendering:pixelated;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.8))}';

function spr(m,x,y,s,fl,flip,pl,Q){Q=Q||X;for(let j=0;j<8;j++)for(let i=0;i<8;i++){const c=m[j][flip?7-i:i];if(c!=='.'){Q.fillStyle=fl?'#fff':(pl||PAL)[c];Q.fillRect(Math.round(x-4*s+i*s),Math.round(y-4*s+j*s),s,s)}}}

function gen(){map=new Uint8Array(MW*MH).fill(1);rooms=[];

const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}};
async function hp(p,s){const d=s+':'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of d)h=((h<<5)+h+c.charCodeAt(0))>>>0;return'f'+h.toString(16)}}

am(m||(stOk()?'':'Хранилище недоступно: прогресс не сохранится'))}

if(!/^[A-Za-z0-9_\-А-Яа-яЁё]{3,16}$/.test(n))return am('Никнейм: 3–16 символов, буквы, цифры, _ и -');
if(p.length<4)return am('Пароль: минимум 4 символа');
if(reg){if(U[nl])return am('Такой никнейм уже занят');const s=Math.random().toString(36).slice(2,10);U[nl]={n,s,h:await hp(p,s)};let old=null;
try{if(!Object.keys(rd('aoe_users')).length)old=localStorage.getItem('aoe2');localStorage.setItem('aoe_users',JSON.stringify(U));if(old)localStorage.setItem('aoe2:'+nl,old)}catch(e){}
login(nl,n,old?'Старое сохранение перенесено в аккаунт':'')}
else{const u=U[nl];if(!u)return am('Аккаунт не найден. Нажмите «Регистрация»');if(await hp(p,u.s)!==u.h)return am('Неверный пароль');login(nl,u.n)}}

<script>
/* ===== Заставка (splash): руины, пепел и угли ===== */
(()=>{
const W=320,H=180,C=document.getElementById('spc'),X=C.getContext('2d');C.width=W;C.height=H;
const R=Math.random;
let seed=7;const sr=()=>(seed=(seed*16807)%2147483647)/2147483647;
const bg=document.createElement('canvas');bg.width=W;bg.height=H;const B=bg.getContext('2d');
function sky(){
  const g=B.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#07060a');g.addColorStop(.6,'#15101a');g.addColorStop(1,'#2a1410');
  B.fillStyle=g;B.fillRect(0,0,W,H);
  for(let i=0;i<50;i++){B.fillStyle=sr()<.2?'#8a8f98':'#3a3550';B.fillRect(sr()*W|0,sr()*90|0,1,1)}
  const mx=232,my=46;
  for(let r=26;r>14;r-=3){B.globalAlpha=.05;B.fillStyle='#c9b79a';B.beginPath();B.arc(mx,my,r,0,7);B.fill()}
  B.globalAlpha=1;B.fillStyle='#bfae92';B.beginPath();B.arc(mx,my,13,0,7);B.fill();
  B.fillStyle='#a1917a';for(const [x,y,r] of [[-4,-3,3],[3,2,4],[-2,6,2]]){B.beginPath();B.arc(mx+x,my+y,r,0,7);B.fill()}
}
function hills(col,base,amp,step){
  B.fillStyle=col;B.beginPath();B.moveTo(0,H);
  let y=base;for(let x=0;x<=W;x+=step){y+=(sr()-.5)*amp;y=Math.max(base-amp*3,Math.min(base+amp*3,y));B.lineTo(x,y)}
  B.lineTo(W,H);B.fill();
}
function ruins(col,gy,x0,x1,scale,glow){
  B.fillStyle=col;
  let x=x0;
  while(x<x1){
    const t=sr(),w=(8+sr()*16|0)*scale;
    if(t<.28){
      const h=(46+sr()*38|0)*scale;B.fillRect(x,gy-h,w,h);
      for(let k=0;k<w;k+=4*scale){if(sr()<.5)B.fillRect(x+k,gy-h-3*scale,3*scale,3*scale)}
      B.fillRect(x+w*.2,gy-h-8*scale,3*scale,8*scale);
      if(glow&&sr()<.7){B.fillStyle='#c2561f';B.fillRect(x+w/2-1,gy-h*.6,2*scale,5*scale);B.fillStyle=col}
    }else if(t<.55){
      const h=(18+sr()*22|0)*scale;B.fillRect(x,gy-h,w,h);
      for(let k=0;k<w-3;k+=7*scale){B.fillStyle='#0b0a0e';B.fillRect(x+k+2,gy-h+6*scale,3*scale,6*scale);B.fillStyle=col}
    }else if(t<.8){
      const h=(28+sr()*14|0)*scale,aw=w+8*scale;
      B.fillRect(x,gy-h,4*scale,h);B.fillRect(x+aw-4*scale,gy-h,4*scale,h);
      B.fillRect(x,gy-h-4*scale,aw,4*scale);
      B.fillStyle='#0b0a0e';B.fillRect(x+4*scale,gy-h,aw-8*scale,3*scale);B.fillStyle=col;
      x+=8*scale;
    }else{
      const h=(4+sr()*8|0)*scale;B.fillRect(x,gy-h,w,h);B.fillRect(x+w*.3,gy-h-3,4,3);
    }
    x+=w+(2+sr()*10|0)*scale;
  }
  B.fillRect(x0,gy,x1-x0,H-gy);
}
sky();
hills('#120e17',128,6,8);
ruins('#181220',136,-4,W+4,.8,false);
hills('#0e0a12',142,4,6);
ruins('#0b080e',152,-4,W+4,1,true);
B.fillStyle='#07050a';B.fillRect(0,166,W,14);
for(let x=0;x<W;x+=3){const h=1+(sr()*4|0);B.fillRect(x,166-h,3,h)}
for(const x of [28,96,170,262]){B.fillRect(x,150,2,16);B.fillRect(x-4,152,10,2)}

const P=[];
function ash(init){return{k:0,x:R()*W,y:init?R()*H:-4,vx:-4-R()*8,vy:6+R()*12,a:.25+R()*.45,c:R()<.3?'#8a8f98':'#5a5560',ph:R()*9}}
function ember(init){return{k:1,x:R()*W,y:init?H*.55+R()*H*.45:H+2,vx:(R()-.5)*8,vy:-(8+R()*20),a:.5+R()*.5,c:['#ffd24a','#ff8a1f','#c2561f'][R()*3|0],ph:R()*9,l:3+R()*5}}
for(let i=0;i<70;i++)P.push(ash(1));
for(let i=0;i<45;i++)P.push(ember(1));

const scene=document.getElementById('sp');let done=false,raf=0,last=0,T=0;
function frame(ts){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;
  X.globalAlpha=1;X.drawImage(bg,0,0);
  const gl=X.createLinearGradient(0,H*.7,0,H);
  gl.addColorStop(0,'rgba(194,86,31,0)');gl.addColorStop(1,'rgba(194,86,31,'+(.16+.04*Math.sin(T*2))+')');
  X.fillStyle=gl;X.fillRect(0,H*.7,W,H*.3);
  X.fillStyle='rgba(120,100,150,.05)';
  for(let k=0;k<3;k++){const y=104+k*18,off=((T*(4+k*3)+k*70)%(W+80))-40;X.fillRect(off-60,y,120,2);X.fillRect(W-off,y+7,90,2)}
  for(let i=0;i<P.length;i++){
    const p=P[i];
    p.x+=(p.vx+Math.sin(T*1.3+p.ph)*(p.k?8:5))*dt;p.y+=p.vy*dt;
    if(p.k){p.l-=dt;if(p.l<=0||p.y<-4)P[i]=ember(0)}
    else if(p.y>H+2||p.x<-4)P[i]=ash(0);
    if(p.x>W+4)p.x=-3;
    let a=p.a;if(p.k){a*=Math.min(1,p.l)*(.6+.4*Math.sin(T*14+p.ph))}
    X.globalAlpha=Math.max(0,a);X.fillStyle=p.c;X.fillRect(p.x|0,p.y|0,1,1);
    if(p.k&&a>.6){X.globalAlpha=a*.25;X.fillRect((p.x|0)-1,p.y|0,3,1);X.fillRect(p.x|0,(p.y|0)-1,1,3)}
  }
  X.globalAlpha=1;
  const v=X.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.7)');X.fillStyle=v;X.fillRect(0,0,W,H);
}
raf=requestAnimationFrame(frame);

function start(){
  if(done)return;done=true;scene.classList.add('out');
  window.dispatchEvent(new CustomEvent('splash:start'));
  setTimeout(()=>{cancelAnimationFrame(raf);scene.remove()},1200);
}
scene.addEventListener('pointerdown',start);
window.addEventListener('keydown',e=>{if(done)return;if(e.code==='Enter'||e.code==='Space'||e.key==='Enter'||e.key===' '){e.preventDefault();start()}},true);
try{document.getElementById('spgo').focus({preventScroll:true})}catch(e){}
})();
</script>
