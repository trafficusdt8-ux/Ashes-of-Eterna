SH.innerHTML='<h1>🔥 Таланты Искры</h1><div class="sl" style="width:min(96%,44em);grid-template-columns:1fr">'+TL.map((q,i)=>{const L=BK.tl[q.k]||0;return '<button '+(L>=TMAX?'disabled ':'')+'onclick="tup('+i+')"><b>'+q.n+' — '+L+'/'+TMAX+'</b>'+q.d+'<br>'+(L>=TMAX?'MAX':tcost(q.k)+' 🪙')+'</button>'}).join('')+'</div><div id="pi">'+msg+'</div><p class="cp">Ржавые Монеты: '+BK.bank+' 🪙 · Действует со следующего забега</p><button onclick="back()"><b>Назад</b></button>'}
function tup(i){const q=TL[i];BK.tl=BK.tl||{};const L=BK.tl[q.k]||0,c=tcost(q.k);if(L>=TMAX)return;
if(BK.bank>=c){BK.bank-=c;BK.tl[q.k]=L+1;sv2();msg='Улучшено!';snd(880,.12,'triangle',.2)}else msg='Не хватает монет: нужно '+c;rtal()}
function rq(){PX=null;const s=BK.st||{},d=BK.qd||{};
SH.innerHTML='<h1>📜 Задания</h1><div class="sl" style="width:min(96%,44em);grid-template-columns:1fr">'+QS.map(q=>{const p=Math.min(s[q.id]||0,q.n),dn=d[q.id];return '<div class="cell'+(dn?' done':'')+'" style="text-align:left"><b>'+q.t+'</b><div style="height:6px;background:#2a1218;margin:.5em 0"><div style="height:100%;width:'+p/q.n*100+'%;background:#ffd24a"></div></div>'+p+'/'+q.n+' · Награда: '+(q.r.c?q.r.c+' 🪙':'XP +'+q.r.x)+'<br>'+(dn?'✔ Получено':'В процессе')+'</div>'}).join('')+'</div><button onclick="back()"><b>Назад</b></button>'}
function qOpen(){menu=true;SET.style.display='none';msg='';SH.style.display='flex';shopOn=1;rq()}
/* ===== Аккаунты (локально, localStorage) ===== */
const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}};
async function hp(p,s){const d=s+':'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of d)h=((h<<5)+h+c.charCodeAt(0))>>>0;return'f'+h.toString(16)}}
function stOk(){try{localStorage.setItem('aoe_t','1');localStorage.removeItem('aoe_t');return true}catch(e){return false}}
function am(m){const e=$('am');if(e)e.textContent=m}
function auth(m){ACC=null;paused=true;menu=false;shopOn=0;SH.style.display='none';SET.style.display='none';OV.style.display='flex';
OV.innerHTML='<h1>Ashes of Eterna</h1><p>Авторизация / Регистрация</p><div style="display:flex;flex-direction:column;gap:.8em;width:min(80%,22em)"><input id="an" class="f" maxlength="16" autocomplete="username" placeholder="'+tr('Никнейм')+'"><input id="ap" class="f" type="password" maxlength="32" autocomplete="current-password" placeholder="'+tr('Пароль')+'"></div><p id="am" style="color:#ff7a7a;min-height:1.8em"></p><div style="display:flex;gap:.8em;width:min(80%,22em)"><button style="flex:1;padding:1.2em .4em" onclick="doAuth(0)"><b>Войти</b></button><button style="flex:1;padding:1.2em .4em" onclick="doAuth(1)"><b>Регистрация</b></button></div><p class="cp">Данные хранятся только на этом устройстве (localStorage).</p>';
am(m||(stOk()?'':'Хранилище недоступно: прогресс не сохранится'))}
function loadBK(){BK=Object.assign({bank:0,own:[0],eq:0},rd('aoe2:'+ACC.nl));ST=SETS[BK.own.includes(BK.eq)?BK.eq:0]}
function login(nl,n,note){runOn=0;ACC={nl,n};try{localStorage.setItem('aoe_sess',nl)}catch(e){}loadBK();over=false;intro();if(note){const p=document.createElement('p');p.textContent=note;p.style.color='#7dff9a';OV.insertBefore(p,OV.children[1])}}
async function doAuth(reg){const n=$('an').value.trim(),p=$('ap').value,nl=n.toLowerCase(),U=rd('aoe_users');
if(!/^[A-Za-z0-9_\-А-Яа-яЁё]{3,16}$/.test(n))return am('Никнейм: 3–16 символов, буквы, цифры, _ и -');
if(p.length<4)return am('Пароль: минимум 4 символа');
if(reg){if(U[nl])return am('Такой никнейм уже занят');const s=Math.random().toString(36).slice(2,10);U[nl]={n,s,h:await hp(p,s)};let old=null;
try{if(!Object.keys(rd('aoe_users')).length)old=localStorage.getItem('aoe2');localStorage.setItem('aoe_users',JSON.stringify(U));if(old)localStorage.setItem('aoe2:'+nl,old)}catch(e){}
login(nl,n,old?'Старое сохранение перенесено в аккаунт':'')}
else{const u=U[nl];if(!u)return am('Аккаунт не найден. Нажмите «Регистрация»');if(await hp(p,u.s)!==u.h)return am('Неверный пароль');login(nl,u.n)}}
function logout(){sv2();runOn=0;try{localStorage.removeItem('aoe_sess')}catch(e){}cut=null;auth()}
setInterval(sv2,5000);
(function boot(){let s=null,U={};try{s=localStorage.getItem('aoe_sess')}catch(e){}U=rd('aoe_users');if(s&&U[s]){ACC={nl:s,n:U[s].n};loadBK();intro()}else auth()})();requestAnimationFrame(loop);
</script></body></html>
